name: Update Rex TMDB poster library

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: write

concurrency:
  group: update-rex-tmdb-posters
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate library
        env:
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
        run: python generate.py --output rex-tmdb-posters.json
      - name: Create smaller Rex subscriptions
        run: python split_library.py rex-tmdb-posters.json
      - name: Validate JSON and poster links
        run: |
          python validate_library.py rex-tmdb-posters.json --check-links 25
          python validate_library.py rex-tmdb-movies.json
          python validate_library.py rex-tmdb-tv.json
          python validate_library.py rex-tmdb-anime.json
          python validate_library.py rex-tmdb-variety.json
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- rex-tmdb-*.json)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rex-tmdb-*.json
          git commit -m "chore: update TMDB poster library"
          git push
